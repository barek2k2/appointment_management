name: Compliance Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: read
jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to @main (has source-upload + verdict enforcement). For a real
      # rollout this would be a tag (e.g. @v1.2) once Emadur cuts it.
      - uses: HIPAACKR/pr-compliance-check@main
        with:
          api-key: ${{ secrets.COMPLIANCE_API_KEY }}
          frameworks: '["hipaa"]'
